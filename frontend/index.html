<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>KissKH Sync</title>
    <script>
      try {
        if (localStorage.getItem('kisskh-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#09090b';
        }
      } catch (_) {}
    </script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #09090b;
        background: #fafafa;
        font-synthesis: none;
        --background: #fafafa;
        --foreground: #09090b;
        --card: #fff;
        --muted: #71717a;
        --border: #e4e4e7;
        --input: #e4e4e7;
        --primary: #18181b;
        --primary-foreground: #fafafa;
        --secondary: #f4f4f5;
        --ring: #a1a1aa;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        color: #fafafa;
        background: #09090b;
        --background: #09090b;
        --foreground: #fafafa;
        --card: #09090b;
        --muted: #a1a1aa;
        --border: #27272a;
        --input: #27272a;
        --primary: #fafafa;
        --primary-foreground: #18181b;
        --secondary: #27272a;
        --ring: #71717a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--background); color: var(--foreground); }
      button, input, select { font: inherit; }
      button {
        display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
        min-height: 36px; padding: .48rem .8rem; border: 1px solid var(--input); border-radius: 7px;
        background: var(--card); color: var(--foreground); font-size: .875rem; font-weight: 500; white-space: nowrap;
        cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s;
      }
      button:hover:not(:disabled) { background: var(--secondary); }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: none; box-shadow: 0 0 0 3px #a1a1aa55; }
      button:disabled { cursor: wait; opacity: .55; }
      button.primary { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
      button.primary:hover:not(:disabled) { background: #27272a; }
      button.subtle { border-color: transparent; background: transparent; }
      input[type="url"] {
        width: min(100%, 650px); min-height: 40px; padding: .55rem .75rem;
        border: 1px solid var(--input); border-radius: 7px; outline: none; background: var(--card); color: var(--foreground);
        font-size: .875rem; box-shadow: 0 1px 2px #00000008;
      }
      input[type="url"]::placeholder { color: #a1a1aa; }
      input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--foreground); }
      .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 80px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 27px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 9px; background: #18181b; color: white; font-size: 17px; }
      h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: -.035em; }
      .tagline, .muted { color: var(--muted); }
      .tagline { margin: 3px 0 0; font-size: .82rem; }
      .header-controls { display: flex; align-items: center; gap: 18px; }
      .status-indicator { display: flex; align-items: center; gap: 8px; color: #52525b; font-size: .8rem; }
      .theme-toggle { gap: 8px; min-height: auto; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: .8rem; }
      .theme-toggle:hover:not(:disabled) { background: transparent; color: var(--foreground); }
      .switch-track { position: relative; width: 32px; height: 18px; flex: 0 0 32px; border-radius: 999px; background: #d4d4d8; transition: background .18s; }
      .switch-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: white; box-shadow: 0 1px 2px #0003; transition: transform .18s; }
      .theme-toggle[aria-checked="true"] .switch-track { background: #71717a; }
      .theme-toggle[aria-checked="true"] .switch-thumb { transform: translateX(14px); }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
      .panel { border: 1px solid var(--border); border-radius: 9px; background: var(--card); box-shadow: 0 1px 2px #00000008; }
      .add-panel { padding: 20px; margin-bottom: 16px; }
      .settings-panel { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 16px 18px; margin: 0 0 16px; }
      .setting-description { margin-top: 4px; color: var(--muted); font-size: .8rem; }
      .setting-controls { display: flex; align-items: center; gap: 9px; }
      select { min-height: 36px; padding: .4rem 2rem .4rem .7rem; border: 1px solid var(--input); border-radius: 7px; background: var(--card); color: var(--foreground); font-size: .875rem; }
      .section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 13px; }
      h2 { margin: 0; font-size: .96rem; font-weight: 600; letter-spacing: -.02em; }
      .add-form { display: flex; flex-wrap: wrap; gap: 9px; }
      .add-form input { flex: 1 1 300px; }
      .series-heading { margin: 30px 2px 12px; }
      .series-count { color: var(--muted); font-size: .8rem; }
      #list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
      .series-card { overflow: hidden; padding: 18px; }
      .series-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
      .series-title { margin: 1px 0 0; font-size: .98rem; font-weight: 600; letter-spacing: -.015em; overflow-wrap: anywhere; }
      .series-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; color: var(--muted); font-size: .78rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .feedback { display: none; align-items: center; gap: 9px; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--background); color: var(--muted); font-size: .84rem; }
      .feedback.visible { display: flex; }
      .feedback.error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
      .feedback.success { border-color: #bbf7d0; background: #f0fdf4; color: #15803d; }
      .feedback .spinner { width: 14px; height: 14px; flex: 0 0 14px; border: 2px solid #d4d4d8; border-top-color: #18181b; border-radius: 50%; animation: spin .8s linear infinite; }
      .feedback.success .spinner, .feedback.error .spinner { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .episodes { margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--border); }
      .episode-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; color: #52525b; font-size: .8rem; }
      .episode-list { display: grid; gap: 6px; max-height: 360px; overflow: auto; padding: 1px; }
      .episode-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--card); color: var(--foreground); font-size: .84rem; }
      .episode-row input { margin: 2px 0 0; flex: 0 0 auto; }
      .episode-copy { min-width: 0; flex: 1; }
      .episode-title { display: block; overflow-wrap: anywhere; }
      .episode-error { display: block; margin-top: 3px; color: #b91c1c; font-size: .78rem; }
      .episode-status { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 7px; }
      .progress-track { height: 4px; overflow: hidden; margin-top: 7px; border-radius: 999px; background: #e4e4e7; }
      .progress-fill { height: 100%; width: 0; border-radius: inherit; background: #71717a; transition: width .3s ease; }
      .progress-fill.is-queued { width: 18%; background: #a1a1aa; }
      .progress-fill.is-active { width: 36%; background: linear-gradient(90deg, #71717a, #d4d4d8, #71717a); background-size: 220% 100%; animation: progress-flow 1.15s linear infinite; }
      .progress-fill.is-complete { width: 100%; background: #22c55e; }
      .progress-fill.is-failed { width: 100%; background: #ef4444; opacity: .75; }
      @keyframes progress-flow { to { background-position: -220% 0; } }
      .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 5px; background: #f4f4f5; color: #52525b; font-size: .7rem; font-weight: 500; text-transform: capitalize; }
      .badge.completed { background: #dcfce7; color: #15803d; }
      .badge.failed { background: #fee2e2; color: #b91c1c; }
      .selection-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
      .empty { padding: 36px 20px; color: var(--muted); text-align: center; font-size: .875rem; }
      .empty strong { display: block; margin-bottom: 5px; color: #18181b; font-size: .95rem; font-weight: 600; }
      .toast { position: fixed; right: 20px; bottom: 20px; z-index: 5; max-width: min(420px, calc(100% - 40px)); padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--foreground); box-shadow: 0 8px 24px #00000012; font-size: .875rem; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s; }
      :root[data-theme="dark"] button.primary:hover:not(:disabled) { background: #e4e4e7; }
      :root[data-theme="dark"] .brand-icon { background: #fafafa; color: #18181b; }
      :root[data-theme="dark"] .status-indicator { color: #a1a1aa; }
      :root[data-theme="dark"] .feedback.error { border-color: #7f1d1d; background: #1c0b0b; color: #fca5a5; }
      :root[data-theme="dark"] .feedback.success { border-color: #14532d; background: #07170d; color: #86efac; }
      :root[data-theme="dark"] .feedback .spinner { border-color: #3f3f46; border-top-color: #fafafa; }
      :root[data-theme="dark"] .episode-toolbar { color: #d4d4d8; }
      :root[data-theme="dark"] .episode-error { color: #fca5a5; }
      :root[data-theme="dark"] .progress-track { background: #27272a; }
      :root[data-theme="dark"] .progress-fill.is-queued { background: #71717a; }
      :root[data-theme="dark"] .progress-fill.is-active { background: linear-gradient(90deg, #71717a, #d4d4d8, #71717a); }
      :root[data-theme="dark"] .badge { background: #27272a; color: #d4d4d8; }
      :root[data-theme="dark"] .badge.completed { background: #052e16; color: #86efac; }
      :root[data-theme="dark"] .badge.failed { background: #450a0a; color: #fca5a5; }
      :root[data-theme="dark"] .empty strong { color: var(--foreground); }
      .toast.visible { opacity: 1; transform: translateY(0); }
      @media (max-width: 700px) {
        .shell { width: min(100% - 24px, 600px); padding-top: 24px; }
        header, .series-top { align-items: flex-start; flex-direction: column; }
        .header-controls { width: 100%; justify-content: space-between; }
        .status-indicator { align-self: flex-start; }
        .actions { width: 100%; }
        .actions button { flex: 1; }
        .series-card, .add-panel { padding: 15px; }
        .settings-panel { align-items: flex-start; flex-direction: column; }
        .episode-toolbar, .selection-actions { align-items: flex-start; flex-direction: column; }
        .setting-controls { width: 100%; flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">▶</div>
          <div><h1>KissKH Sync</h1><p class="tagline">Your shows, organized and ready for Jellyfin.</p></div>
        </div>
        <div class="header-controls">
          <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span><span>Dark mode</span>
          </button>
          <div class="status-indicator"><span class="dot"></span>Service online</div>
        </div>
      </header>

      <section class="panel settings-panel" id="watcher-panel">
        <div>
          <h2><span class="dot"></span> Automatic watcher</h2>
          <div id="watcher-status" class="setting-description">Checking for new episodes and downloading them automatically.</div>
        </div>
        <button id="run-watcher" class="primary" type="button">Check all series now</button>
      </section>

      <section class="panel add-panel">
        <div class="section-heading"><h2>Add a series</h2><span class="muted">Paste a KissKH series URL</span></div>
        <form id="add" class="add-form">
          <input id="url" type="url" placeholder="https://kisskh.is/Drama/…" required />
          <button class="primary" type="submit">＋ Add series</button>
        </form>
      </section>

      <section class="panel settings-panel">
        <div><h2>Download queue</h2><div class="setting-description">Choose how many episodes may download at once.</div></div>
        <form id="download-settings" class="setting-controls">
          <label for="parallel-limit" class="muted">Parallel downloads</label>
          <select id="parallel-limit" aria-label="Maximum parallel downloads"></select>
          <button type="submit">Save</button>
        </form>
      </section>

      <section>
        <div class="section-heading series-heading"><h2>Your series</h2><span id="series-count" class="series-count"></span></div>
        <ul id="list"></ul>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      const list = document.querySelector('#list');
      const themeToggle = document.querySelector('#theme-toggle');
      function setTheme(theme, persist = false) {
        const isDark = theme === 'dark';
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        themeToggle.setAttribute('aria-checked', String(isDark));
        themeToggle.setAttribute('aria-label', isDark ? 'Dark mode enabled' : 'Dark mode disabled');
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#09090b' : '#f8fafc';
        if (persist) {
          try { localStorage.setItem('kisskh-theme', isDark ? 'dark' : 'light'); } catch (_) {}
        }
      }
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
      themeToggle.addEventListener('click', () => {
        setTheme(themeToggle.getAttribute('aria-checked') === 'true' ? 'light' : 'dark', true);
      });
      let toastTimer;
      function notify(message) {
        const toast = document.querySelector('#toast');
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), 4500);
      }
      function makeButton(label, action, kind = '') {
        const element = document.createElement('button');
        element.textContent = label;
        if (kind) element.classList.add(kind);
        element.onclick = action;
        return element;
      }
      function feedbackFor(id) { return document.querySelector(`#feedback-${id}`); }
      function setFeedback(id, message, kind = 'working') {
        const panel = feedbackFor(id);
        if (!panel) return;
        panel.replaceChildren();
        panel.className = `feedback visible ${kind}`;
        if (kind === 'working') {
          const spinner = document.createElement('span');
          spinner.className = 'spinner';
          panel.append(spinner);
        }
        const text = document.createElement('span');
        text.textContent = message;
        panel.append(text);
      }
      async function api(url, options = {}) {
        const response = await fetch(url, options);
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail || body);
          throw new Error(detail || `Request failed (${response.status})`);
        }
        return body;
      }
      async function load() {
        try {
          const series = await api('/api/series');
          document.querySelector('#series-count').textContent = `${series.length} ${series.length === 1 ? 'show' : 'shows'}`;
          list.replaceChildren();
          if (!series.length) {
            const empty = document.createElement('li');
            empty.className = 'panel empty';
            empty.innerHTML = '<strong>No series yet</strong>Add a KissKH URL above to get started.';
            list.append(empty);
            return;
          }
          for (const item of series) {
            const card = document.createElement('li');
            card.className = 'panel series-card';
            card.id = `series-${item.id}`;
            const top = document.createElement('div');
            top.className = 'series-top';
            const details = document.createElement('div');
            const title = document.createElement('h3');
            title.className = 'series-title';
            title.textContent = item.name;
            const autoLabel = document.createElement('label');
            autoLabel.className = 'muted';
            const autoDownload = document.createElement('input');
            autoDownload.type = 'checkbox';
            autoDownload.checked = item.enabled;
            autoDownload.setAttribute('aria-label', `Automatically download new episodes of ${item.name}`);
            autoDownload.onchange = async () => {
              autoDownload.disabled = true;
              try {
                await api(`/api/series/${item.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled: autoDownload.checked }) });
              } catch (error) {
                autoDownload.checked = !autoDownload.checked;
                notify(`Could not update automatic downloads: ${error.message}`);
              } finally { autoDownload.disabled = false; }
            };
            autoLabel.append(autoDownload, document.createTextNode(' Automatically download new episodes'));
            const meta = document.createElement('div');
            meta.className = 'series-meta';
            meta.textContent = `Season ${String(item.season).padStart(2, '0')} · ${item.quality} · Last sync: ${item.last_sync_at ? new Date(item.last_sync_at).toLocaleString() : 'Never'}`;
            details.append(title, autoLabel, meta);
            const actions = document.createElement('div');
            actions.className = 'actions';
            actions.append(
              makeButton('Discover episodes', () => discover(item.id), 'primary'),
              makeButton('Download all missing', () => syncSeries(item.id)),
              makeButton('Episodes ▾', () => toggleEpisodes(item.id), 'subtle'),
            );
            actions.lastElementChild.dataset.episodeToggle = 'true';
            top.append(details, actions);
            const feedback = document.createElement('div');
            feedback.id = `feedback-${item.id}`;
            feedback.className = 'feedback';
            const episodes = document.createElement('div');
            episodes.className = 'episodes';
            episodes.id = `episodes-${item.id}`;
            episodes.hidden = true;
            card.append(top, feedback, episodes);
            list.append(card);
          }
        } catch (error) {
          notify(`Could not load series: ${error.message}`);
        }
      }
      async function loadSettings() {
        try {
          const settings = await api('/api/settings');
          const select = document.querySelector('#parallel-limit');
          select.replaceChildren();
          for (let count = 1; count <= 16; count += 1) {
            const option = document.createElement('option');
            option.value = count;
            option.textContent = `${count} ${count === 1 ? 'download' : 'downloads'}`;
            select.append(option);
          }
          select.value = settings.max_concurrent_downloads;
        } catch (error) { notify(`Could not load settings: ${error.message}`); }
      }
      async function loadWatcher() {
        try {
          const watcher = await api('/api/watcher');
          const next = watcher.next_run_at ? new Date(watcher.next_run_at).toLocaleString() : 'soon';
          document.querySelector('#watcher-status').textContent = watcher.enabled
            ? `Checks all series every ${watcher.interval_minutes} minutes · next check ${next}`
            : 'Automatic checks are currently stopped.';
        } catch (error) {
          document.querySelector('#watcher-status').textContent = `Watcher status unavailable: ${error.message}`;
        }
      }
      async function discover(id) {
        setFeedback(id, 'Queuing episode discovery…');
        try {
          const result = await api(`/api/series/${id}/discover`, { method: 'POST' });
          setFeedback(id, `Discovery job #${result.job_id} is running. Checking KissKH for episode metadata…`);
          waitForJob(result.job_id, id, true);
        } catch (error) {
          setFeedback(id, `Could not start discovery: ${error.message}`, 'error');
        }
      }
      async function syncSeries(id) {
        setFeedback(id, 'Queuing sync for all missing episodes…');
        try {
          const job = await api(`/api/series/${id}/sync`, { method: 'POST' });
          setFeedback(id, `Sync job #${job.job_id} is running…`);
          waitForJob(job.job_id, id, false);
        } catch (error) {
          setFeedback(id, `Could not start sync: ${error.message}`, 'error');
        }
      }
      async function toggleEpisodes(id) {
        const container = document.querySelector(`#episodes-${id}`);
        const toggle = document.querySelector(`#series-${id} [data-episode-toggle]`);
        if (!container.hidden) {
          container.hidden = true;
          toggle.textContent = 'Episodes ▾';
          return;
        }
        container.hidden = false;
        toggle.textContent = 'Episodes ▴';
        await showEpisodes(id);
      }
      async function showEpisodes(id) {
        const container = document.querySelector(`#episodes-${id}`);
        container.hidden = false;
        const toggle = document.querySelector(`#series-${id} [data-episode-toggle]`);
        if (toggle) toggle.textContent = 'Episodes ▴';
        container.replaceChildren();
        setFeedback(id, 'Loading saved episode list…');
        try {
          const rows = await api(`/api/series/${id}/episodes`);
          if (!rows.length) {
            setFeedback(id, 'No episodes are saved yet. Click “Discover episodes” to fetch them from KissKH.', 'error');
            return;
          }
          setFeedback(id, `${rows.length} episode${rows.length === 1 ? '' : 's'} found. Select pending or failed episodes to queue.` , 'success');
          const toolbar = document.createElement('div');
          toolbar.className = 'episode-toolbar';
          const summary = document.createElement('span');
          summary.textContent = `${rows.filter((row) => row.status === 'completed').length} completed · ${rows.filter((row) => row.status !== 'completed').length} available`;
          const selectAll = document.createElement('button');
          selectAll.className = 'subtle';
          selectAll.textContent = 'Select all available';
          toolbar.append(summary, selectAll);
          const episodeList = document.createElement('div');
          episodeList.className = 'episode-list';
          const availableBoxes = [];
          for (const row of rows) {
            const label = document.createElement('label');
            label.className = 'episode-row';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = row.id;
            checkbox.disabled = ['completed', 'downloading', 'queued'].includes(row.status);
            if (!checkbox.disabled) availableBoxes.push(checkbox);
            const copy = document.createElement('span');
            copy.className = 'episode-copy';
            const title = document.createElement('span');
            title.className = 'episode-title';
            title.textContent = `Episode ${row.episode_number}${row.title ? ` — ${row.title}` : ''}`;
            const statusLine = document.createElement('div');
            statusLine.className = 'episode-status';
            const status = document.createElement('span');
            status.className = `badge episode-badge ${row.status}`;
            status.textContent = row.status === 'queued' ? `Queued · #${row.queue_position}` : row.status;
            const hint = document.createElement('span');
            hint.className = 'muted episode-hint';
            hint.textContent = progressHint(row.status, row.queue_position);
            statusLine.append(status, hint);
            if (['queued', 'downloading'].includes(row.status)) {
              const stop = makeButton('Stop', async () => {
                stop.disabled = true;
                try {
                  await api(`/api/episodes/${row.id}/stop`, { method: 'POST' });
                  await showEpisodes(id);
                } catch (error) { stop.disabled = false; notify(`Could not stop download: ${error.message}`); }
              }, 'subtle');
              statusLine.append(stop);
            }
            const progress = document.createElement('div');
            progress.className = 'progress-track';
            const fill = document.createElement('div');
            fill.className = `progress-fill ${progressClass(row.status)}`;
            progress.append(fill);
            copy.append(title, statusLine, progress);
            label.dataset.episodeId = row.id;
            label.dataset.status = row.status;
            if (row.error) {
              const error = document.createElement('span');
              error.className = 'episode-error';
              error.textContent = row.error;
              copy.append(error);
            }
            label.append(checkbox, copy);
            episodeList.append(label);
          }
          selectAll.onclick = () => {
            const shouldCheck = availableBoxes.some((box) => !box.checked);
            availableBoxes.forEach((box) => { box.checked = shouldCheck; });
            selectAll.textContent = shouldCheck ? 'Clear selection' : 'Select all available';
          };
          const footer = document.createElement('div');
          footer.className = 'selection-actions';
          const help = document.createElement('span');
          help.className = 'muted';
          help.textContent = 'Completed episodes are protected from re-download.';
          const download = makeButton('Download selected', async () => {
            const episodeIds = [...episodeList.querySelectorAll('input:checked')].map((box) => Number(box.value));
            if (!episodeIds.length) {
              setFeedback(id, 'Choose at least one pending or failed episode first.', 'error');
              return;
            }
            download.disabled = true;
            setFeedback(id, `Queuing ${episodeIds.length} selected episode${episodeIds.length === 1 ? '' : 's'}…`);
            try {
              const result = await api(`/api/series/${id}/episodes/download`, {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ episode_ids: episodeIds }),
              });
              setFeedback(id, `Download job #${result.job_id} is running…`);
              waitForJob(result.job_id, id, false);
            } catch (error) {
              download.disabled = false;
              setFeedback(id, `Could not queue selected episodes: ${error.message}`, 'error');
            }
          }, 'primary');
          footer.append(help, download);
          container.append(toolbar, episodeList, footer);
        } catch (error) {
          setFeedback(id, `Could not load episodes: ${error.message}`, 'error');
        }
      }
      function progressClass(status) {
        return ({ queued: 'is-queued', downloading: 'is-active', completed: 'is-complete', failed: 'is-failed' })[status] || '';
      }
      function progressHint(status, position) {
        if (status === 'queued') return `Waiting · queue #${position}`;
        if (status === 'downloading') return 'Downloading now';
        if (status === 'completed') return 'Completed · ready in Jellyfin';
        if (status === 'failed') return 'Failed · select again to retry';
        return 'Not queued';
      }
      async function refreshEpisodeStatuses(id) {
        const rows = await api(`/api/series/${id}/episodes`);
        const container = document.querySelector(`#episodes-${id}`);
        if (!container) return;
        const currentRows = container.querySelectorAll('[data-episode-id]');
        if (currentRows.length !== rows.length) { await showEpisodes(id); return; }
        for (const row of rows) {
          const element = container.querySelector(`[data-episode-id="${row.id}"]`);
          if (!element) continue;
          if (element.dataset.status !== row.status) { await showEpisodes(id); return; }
          element.querySelector('input[type="checkbox"]').disabled =
            ['completed', 'downloading', 'queued'].includes(row.status);
          const badge = element.querySelector('.episode-badge');
          badge.className = `badge episode-badge ${row.status}`;
          badge.textContent = row.status === 'queued' ? `Queued · #${row.queue_position}` : row.status;
          element.querySelector('.episode-hint').textContent = progressHint(row.status, row.queue_position);
          element.querySelector('.progress-fill').className = `progress-fill ${progressClass(row.status)}`;
          const oldError = element.querySelector('.episode-error');
          if (row.error && !oldError) {
            const message = document.createElement('span');
            message.className = 'episode-error';
            message.textContent = row.error;
            element.querySelector('.episode-copy').append(message);
          } else if (!row.error && oldError) oldError.remove();
        }
      }
      function waitForJob(jobId, seriesId, discovery) {
        const started = Date.now();
        const poll = async () => {
          try {
            const job = await api(`/api/jobs/${jobId}`);
            if (job.status === 'completed') {
              if (discovery) {
                setFeedback(seriesId, `Discovery complete: ${job.episodes_found} source episodes found.`, 'success');
              } else {
                setFeedback(seriesId, `Job complete: ${job.episodes_downloaded} episode(s) downloaded.`, 'success');
              }
              await showEpisodes(seriesId);
              return;
            }
            if (job.status === 'failed') {
              setFeedback(seriesId, `Job failed: ${job.error || 'The sync worker reported an error.'}`, 'error');
              return;
            }
            if (Date.now() - started > 10 * 60 * 1000) {
              setFeedback(seriesId, `Job #${jobId} is still ${job.status}. Check Jobs or the container logs for details.`, 'error');
              return;
            }
            setFeedback(seriesId, `Job #${jobId} · ${job.status}${discovery ? ' · loading KissKH episode metadata' : ''}…`);
            if (!discovery) await refreshEpisodeStatuses(seriesId);
            setTimeout(poll, 1800);
          } catch (error) {
            setFeedback(seriesId, `Could not check job status: ${error.message}`, 'error');
          }
        };
        setTimeout(poll, 650);
      }
      document.querySelector('#download-settings').onsubmit = async (event) => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button');
        button.disabled = true;
        const count = Number(document.querySelector('#parallel-limit').value);
        try {
          await api('/api/settings', {
            method: 'PATCH', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ max_concurrent_downloads: count }),
          });
          notify(`Saved: up to ${count} episode${count === 1 ? '' : 's'} download at once.`);
        } catch (error) { notify(`Could not save download limit: ${error.message}`); }
        finally { button.disabled = false; }
      };
      document.querySelector('#run-watcher').onclick = async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = 'Queueing checks…';
        try {
          const result = await api('/api/watcher/run', { method: 'POST' });
          notify(result.series_queued
            ? `Watcher queued checks for ${result.series_queued} series.`
            : 'No series to check.');
        } catch (error) {
          notify(`Could not start watcher: ${error.message}`);
        } finally {
          button.disabled = false;
          button.textContent = 'Check all series now';
        }
      };
      document.querySelector('#add').onsubmit = async (event) => {
        event.preventDefault();
        const submit = event.currentTarget.querySelector('button[type="submit"]');
        submit.disabled = true;
        try {
          await api('/api/series', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ source_url: document.querySelector('#url').value }),
          });
          document.querySelector('#url').value = '';
          notify('Series added. Click Discover episodes to load its episode list.');
          await load();
        } catch (error) {
          notify(`Could not add series: ${error.message}`);
        } finally {
          submit.disabled = false;
        }
      };
      load();
      loadSettings();
      loadWatcher();
    </script>
  </body>
</html>
